<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#111827"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
  </defs>
  <rect width="600" height="120" rx="12" fill="url(#bannerGrad)" stroke="#f97316" stroke-width="1" opacity="0.3"/>
  
  <!-- Left star -->
  <g transform="translate(55,60)">
    <polygon points="0,-30 8,-10 28,-10 12,3 18,24 0,12 -18,24 -12,3 -28,-10 -8,-10" fill="#fbbf24" opacity="0.8"/>
  </g>
  
  <!-- Right gear -->
  <g transform="translate(545,60) rotate(15)" opacity="0.6">
    <circle r="22" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <circle r="9" fill="#111827" stroke="#3b82f6" stroke-width="1"/>
    <path d="M0,-22 L4,-18 L6,-10 L9,-12 L11,-5 L15,-3 L16,2 L19,5 L19,9 L22,11 L22,15 L15,16 L12,22 L8,19 L6,24 L2,22 L-2,24 L-6,22 L-8,19 L-12,22 L-15,16 L-22,15 L-22,11 L-19,9 L-19,5 L-16,2 L-15,-3 L-11,-5 L-9,-12 L-6,-10 L-4,-18 Z" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
  </g>
  
  <!-- Title -->
  <text x="300" y="52" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#fff" letter-spacing="3">
    TESORO TROVATO!
  </text>
  <text x="300" y="80" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="2">
    Hai scoperto un contenuto speciale — continua a esplorare
  </text>
</svg>