<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1220"/>
      <stop offset="100%" style="stop-color:#111d35"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="80%">
      <stop offset="0%" style="stop-color:rgba(16,185,129,0.1)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="360" fill="url(#bg)"/>
  <rect width="800" height="360" fill="url(#glow)"/>
  <!-- Downward-breaking arc — freedom from debt -->
  <path d="M120 160 Q300 280 400 220 Q500 160 680 280" fill="none" stroke="#10b981" stroke-width="3" opacity="0.5"/>
  <path d="M140 150 Q300 260 400 210 Q500 150 660 260" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.25"/>
  <!-- Breaking point marker -->
  <circle cx="400" cy="220" r="10" fill="#10b981" opacity="0.6"/>
  <circle cx="400" cy="220" r="20" fill="none" stroke="#10b981" stroke-width="1" opacity="0.3"/>
  <!-- Subtle arrow up -->
  <path d="M380 120 L400 90 L420 120" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.3"/>
</svg>