<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="blogGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#blogGrad5)"/>
  
  <!-- Breaking chains visual -->
  <g transform="translate(400,180)" opacity="0.2">
    <!-- Chain links -->
    <path d="M-120,-10 Q-110,-30 -90,-25 Q-70,-20 -60,-35 Q-50,-50 -30,-40 Q-10,-30 0,-15" fill="none" stroke="#f97316" stroke-width="3"/>
    <path d="M0,-15 Q10,-30 30,-40 Q50,-50 60,-35 Q70,-20 90,-25 Q110,-30 120,-10" fill="none" stroke="#f97316" stroke-width="3"/>
    <path d="M-120,10 Q-110,-10 -90,-5 Q-70,0 -60,15 Q-50,30 -30,20 Q-10,10 0,25" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <path d="M0,25 Q10,10 30,20 Q50,30 60,15 Q70,0 90,-5 Q110,-10 120,10" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <!-- Broken chain -->
    <line x1="-120" y1="50" x2="120" y2="50" stroke="#10b981" stroke-width="2.5" stroke-dasharray="8,4" opacity="0.5"/>
  </g>
  
  <!-- Wrench icon -->
  <g transform="translate(350,160)" opacity="0.3">
    <rect x="-80" y="-5" width="160" height="10" rx="5" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <path d="M-90,-5 L-100,-20 L-85,-25 L-70,-10" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <path d="M90,-5 L100,-20 L85,-25 L70,-10" fill="none" stroke="#fbbf24" stroke-width="2"/>
  </g>
  
  <!-- Category -->
  <rect x="60" y="40" width="140" height="32" rx="16" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1"/>
  <text x="130" y="61" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="600" fill="#ef4444">DEBITO</text>
  
  <!-- Title -->
  <text x="60" y="135" font-family="Inter, 'Segoe UI', Arial" font-size="34" font-weight="800" fill="#fff">
    Uscire dal
  </text>
  <text x="60" y="175" font-family="Inter, 'Segoe UI', Arial" font-size="34" font-weight="800" fill="#ef4444">
    Debito ✊
  </text>
  
  <!-- Subtitle -->
  <text x="60" y="220" font-family="Inter, 'Segoe UI', Arial" font-size="15" fill="#94a3b8">
    Il metodo dell'officina: Avalanche vs Snowball per spezzare
  </text>
  <text x="60" y="245" font-family="Inter, 'Segoe UI', Arial" font-size="15" fill="#94a3b8">
    le catene del debito e ricominciare a correre
  </text>
  
  <!-- Author -->
  <g transform="translate(60, 315)">
    <circle cx="20" cy="12" r="12" fill="#334155" stroke="#ef4444" stroke-width="2"/>
    <text x="38" y="16" font-family="Inter, Arial" font-size="13" fill="#cbd5e1">Antonio — TreasuryWorks</text>
  </g>
  
  <!-- Date -->
  <text x="60" y="365" font-family="Inter, Arial" font-size="12" fill="#475569">18 Maggio 2026 • 8 min di lettura</text>
</svg>