    <circle r="22" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <path d="M0,-60 L9,-52 L14,-40 L19,-43 L23,-32 L30,-28 L31,-19 L38,-15 L42,-6 L45,2 L45,12 L49,16 L52,24 L49,32 L45,36 L38,40 L30,42 L23,48 L14,42 L9,50 L5,49 L0,52 L-5,49 L-14,50 L-19,42 L-23,48 L-30,42 L-38,40 L-45,36 L-49,32 L-45,24 L-49,16 L-45,12 L-45,2 L-42,-6 L-38,-15 L-31,-19 L-30,-28 L-23,-32 L-19,-43 L-14,-40 L-9,-52 Z" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
