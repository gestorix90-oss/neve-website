    <path d="M0,-80 L12,-70 L18,-55 L25,-60 L30,-45 L40,-40 L42,-26 L50,-22 L56,-10 L60,2 L60,16 L66,22 L70,34 L66,44 L60,50 L50,54 L40,52 L30,60 L18,54 L12,64 L6,62 L0,68 L-6,62 L-12,64 L-18,54 L-30,60 L-40,52 L-50,54 L-60,50 L-66,44 L-60,34 L-66,22 L-60,16 L-60,2 L-56,-10 L-50,-22 L-42,-26 L-40,-40 L-30,-45 L-25,-60 L-18,-55 L-12,-70 Z" fill="none" stroke="#f97316" stroke-width="1.5"/>
  </g>
  <g transform="translate(1100,150) rotate(45)" opacity="0.08">
