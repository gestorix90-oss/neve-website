<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="blogGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#blogGrad4)"/>
  
  <!-- Piggy bank / savings visual -->
  <g transform="translate(400,180)" opacity="0.2">
    <ellipse cx="0" cy="30" rx="70" ry="50" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M-70,30 Q-80,0 -60,-20 L-30,-30 Q-10,-35 0,-30 L10,-30 Q20,-35 40,-30 L70,-20 Q90,0 80,30 Z" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="-20" cy="25" r="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="20" cy="25" r="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <path d="M-10,35 Q0,45 10,35" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="-50" y="-15" width="100" height="8" rx="4" fill="#3b82f6" opacity="0.5"/>
  </g>
  
  <!-- Coins -->
  <g opacity="0.15">
    <circle cx="150" cy="150" r="20" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="150" y="156" text-anchor="middle" font-size="20" fill="#fbbf24">€</text>
    <circle cx="650" cy="250" r="15" fill="none" stroke="#f97316" stroke-width="1.5"/>
    <text x="650" y="255" text-anchor="middle" font-size="14" fill="#f97316">€</text>
    <circle cx="680" cy="120" r="10" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <text x="680" y="124" text-anchor="middle" font-size="10" fill="#3b82f6">€</text>
    <circle cx="120" cy="280" r="12" fill="none" stroke="#a855f7" stroke-width="1"/>
    <text x="120" y="284" text-anchor="middle" font-size="11" fill="#a855f7">€</text>
  </g>
  
  <!-- Category -->
  <rect x="60" y="40" width="120" height="32" rx="16" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1"/>
  <text x="120" y="61" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="600" fill="#10b981">BUDGET</text>
  
  <!-- Title -->
  <text x="60" y="135" font-family="Inter, 'Segoe UI', Arial" font-size="34" font-weight="800" fill="#fff">
