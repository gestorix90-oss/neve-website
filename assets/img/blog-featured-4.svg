  </text>
  
  <!-- Author -->
  <g transform="translate(60, 315)">
    <circle cx="20" cy="12" r="12" fill="#334155" stroke="#10b981" stroke-width="2"/>
    <text x="38" y="16" font-family="Inter, Arial" font-size="13" fill="#cbd5e1">Antonio — TreasuryWorks</text>
  </g>
  
  <!-- Date -->
  <text x="60" y="365" font-family="Inter, Arial" font-size="12" fill="#475569">18 Maggio 2026 • 6 min di lettura</text>
