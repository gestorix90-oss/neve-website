<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1220"/>
      <stop offset="100%" style="stop-color:#111d35"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:rgba(249,115,22,0.08)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="360" fill="url(#bg)"/>
  <rect width="800" height="360" fill="url(#glow)"/>
  <!-- Three horizontal bars — 50/30/20 -->
  <rect x="200" y="140" width="300" height="40" rx="6" fill="none" stroke="#f97316" stroke-width="2" opacity="0.5"/>
  <rect x="200" y="195" width="220" height="40" rx="6" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  <rect x="200" y="250" width="140" height="40" rx="6" fill="none" stroke="#10b981" stroke-width="2" opacity="0.35"/>
  <!-- Labels -->
  <text x="520" y="165" font-family="Inter, sans-serif" font-size="16" fill="#f97316" opacity="0.7">50%</text>
  <text x="440" y="220" font-family="Inter, sans-serif" font-size="16" fill="#3b82f6" opacity="0.7">30%</text>
  <text x="360" y="275" font-family="Inter, sans-serif" font-size="16" fill="#10b981" opacity="0.7">20%</text>
</svg>