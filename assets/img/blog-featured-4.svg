  </text>
  <text x="60" y="175" font-family="Inter, 'Segoe UI', Arial" font-size="34" font-weight="800" fill="#10b981">
    50/30/20
  </text>
  
  <!-- Subtitle -->
  <text x="60" y="220" font-family="Inter, 'Segoe UI', Arial" font-size="15" fill="#94a3b8">
