<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="blogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#blogGrad)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#f97316" stroke-width="0.5" opacity="0.3"/>
  <circle cx="700" cy="300" r="80" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.3"/>
  <circle cx="400" cy="200" r="120" fill="none" stroke="#fbbf24" stroke-width="0.3" opacity="0.2"/>
  
  <!-- Money/brain abstract -->
  <g transform="translate(400,180)" opacity="0.15">
    <path d="M-60,-30 Q-30,-70 20,-60 Q50,-55 60,-20 Q70,5 50,30 Q25,50 0,45 Q-25,55 -50,35 Q-70,20 -68,0 Z" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="0" y="15" text-anchor="middle" font-size="80" fill="#fbbf24" opacity="0.3">$</text>
  </g>
  
  <!-- Lines pattern -->
  <g opacity="0.05" stroke="#f97316" stroke-width="0.5">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  
  <!-- Category badge -->
  <rect x="60" y="40" width="140" height="32" rx="16" fill="rgba(249,115,22,0.2)" stroke="#f97316" stroke-width="1"/>
  <text x="130" y="61" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="600" fill="#f97316">PSICOLOGIA</text>
  
  <!-- Title -->
  <text x="60" y="130" font-family="Inter, 'Segoe UI', Arial" font-size="36" font-weight="800" fill="#fff" letter-spacing="-0.5">
    Perché il 90% dei
  </text>
  <text x="60" y="170" font-family="Inter, 'Segoe UI', Arial" font-size="36" font-weight="800" fill="#f97316" letter-spacing="-0.5">
    trader perde soldi
  </text>
  
  <!-- Subtitle -->
  <text x="60" y="220" font-family="Inter, 'Segoe UI', Arial" font-size="16" fill="#94a3b8" letter-spacing="0.5">
    Bias cognitivi, paura e FOMO: lo studio
  </text>
  <text x="60" y="245" font-family="Inter, 'Segoe UI', Arial" font-size="16" fill="#94a3b8" letter-spacing="0.5">
    JPMorgan che spiega il meccanismo del denaro
  </text>
  
  <!-- Author line -->
  <g transform="translate(60, 310)">
    <circle cx="20" cy="12" r="12" fill="#334155" stroke="#f97316" stroke-width="2"/>
    <text x="38" y="16" font-family="Inter, Arial" font-size="13" fill="#cbd5e1">Antonio — TreasuryWorks</text>
  </g>
  
  <!-- Date -->
  <text x="60" y="360" font-family="Inter, Arial" font-size="12" fill="#475569">18 Maggio 2026 • 5 min di lettura</text>
  
  <!-- Arrow -->
  <g transform="translate(700, 180)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#f97316" stroke-width="2"/>
    <polygon points="60,-6 72,0 60,6" fill="#f97316"/>
  </g>
</svg>