<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="500" height="200" rx="16" fill="#0f172a"/>
  <rect x="2" y="2" width="496" height="196" rx="14" fill="none" stroke="url(#textGrad)" stroke-width="1" opacity="0.3"/>
  
  <!-- Small gear icon -->
  <g transform="translate(45,100)">
    <circle r="28" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>
    <circle r="12" fill="#111827" stroke="url(#accentGrad)" stroke-width="1.5"/>
    <rect x="-3" y="-32" width="6" height="18" rx="1" fill="#fbbf24" opacity="0.9"/>
    <rect x="-3" y="-32" width="6" height="18" rx="1" fill="#fbbf24" opacity="0.9" transform="rotate(60)"/>
    <rect x="-3" y="-32" width="6" height="18" rx="1" fill="#fbbf24" opacity="0.9" transform="rotate(120)"/>
  </g>
  
  <!-- Text: Treasury -->
  <text x="85" y="108" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" letter-spacing="2">
    Treasury
  </text>
  
  <!-- Text: Works -->
  <text x="320" y="108" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="800" fill="url(#accentGrad)" letter-spacing="2">
    Works
  </text>
  
  <!-- Tagline -->
  <text x="135" y="145" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="4">
    L'OFFICINA DELLA TUA RICCHEZZA
  </text>
  
  <!-- Decorative line -->
  <line x1="135" y1="158" x2="380" y2="158" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.5"/>
</svg>