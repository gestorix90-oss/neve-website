<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" class="blog-hero-svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2a1a3e"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="350" fill="url(#bg3)"/>
  <!-- Split brain: left side old/traditional, right side new/different -->
  <ellipse cx="400" cy="140" rx="120" ry="80" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.4"/>
  <!-- Left side - "old thinking" -->
  <line x1="280" y1="100" x2="280" y2="180" stroke="#ef4444" stroke-width="1" opacity="0.2" stroke-dasharray="4,4"/>
  <text x="230" y="110" font-family="Inter" font-size="16" fill="#64748b" opacity="0.5" text-anchor="middle">VECCHIO</text>
  <text x="230" y="130" font-family="Inter" font-size="14" fill="#ef4444" opacity="0.4" text-anchor="middle">"Risparmiare"</text>
  <text x="230" y="150" font-family="Inter" font-size="14" fill="#ef4444" opacity="0.4" text-anchor="middle">"sotto il materasso"</text>
  <path d="M230,160 Q240,170 230,175" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.3"/>
  <!-- Right side - "new thinking" -->
  <line x1="520" y1="100" x2="520" y2="180" stroke="#10b981" stroke-width="1" opacity="0.2" stroke-dasharray="4,4"/>
  <text x="570" y="110" font-family="Inter" font-size="16" fill="#94a3b8" opacity="0.5" text-anchor="middle">NUOVO</text>
  <text x="570" y="130" font-family="Inter" font-size="14" fill="#10b981" opacity="0.5" text-anchor="middle">INVESTIRE</text>
  <text x="570" y="150" font-family="Inter" font-size="14" fill="#10b981" opacity="0.5" text-anchor="middle">"far lavorare i soldi"</text>
  <path d="M570,160 Q580,170 570,175" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
  <!-- Lightning bolt between -->
  <path d="M395,80 L410,120 L390,120 L405,170" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  <path d="M385,80 L400,120 L380,120 L395,170" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
  <!-- Upward arrows on right -->
  <polygon points="570,200 575,190 565,190" fill="#10b981" opacity="0.3"/>
  <polygon points="585,210 590,198 580,198" fill="#10b981" opacity="0.3"/>
  <polygon points="560,215 565,203 555,203" fill="#10b981" opacity="0.2"/>
  <!-- Floating dollar signs -->
  <text x="100" y="260" font-size="20" fill="#a855f7" opacity="0.3">$</text>
  <text x="650" y="250" font-size="18" fill="#10b981" opacity="0.3">€</text>
  <text x="140" cy="220" font-size="14" fill="#a855f7" opacity="0.2">$</text>
  <text x="600" y="280" font-size="16" fill="#10b981" opacity="0.2">€</text>
  <!-- Spark/idea dots -->
  <circle cx="350" cy="60" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="450" cy="50" r="2" fill="#10b981" opacity="0.5"/>
  <circle cx="410" cy="55" r="4" fill="#a855f7" opacity="0.4"/>
  <!-- Neural network lines -->
  <line x1="320" y1="130" x2="360" y2="100" stroke="#a855f7" stroke-width="0.8" opacity="0.2"/>
  <line x1="480" y1="130" x2="520" y2="100" stroke="#a855f7" stroke-width="0.8" opacity="0.2"/>
  <line x1="400" y1="90" x2="440" y2="140" stroke="#a855f7" stroke-width="0.8" opacity="0.2"/>
  <!-- Title -->
  <text x="400" y="290" font-family="Inter, sans-serif" font-size="26" font-weight="800" fill="#a855f7" text-anchor="middle" filter="url(#glow3)">Pensiero Diverso = Soldi Diversi</text>
  <text x="400" y="315" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" opacity="0.5">"Cambia il modo di pensare, cambiano i risultati"</text>
</svg>