<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480">
  <defs>
    <radialGradient id="glow1" cx="35%" cy="40%">
      <stop offset="0%" style="stop-color:rgba(249,115,22,0.08)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="65%" cy="60%">
      <stop offset="0%" style="stop-color:rgba(59,130,246,0.06)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <rect width="600" height="480" fill="none"/>
  <rect width="600" height="480" fill="url(#glow1)"/>
  <rect width="600" height="480" fill="url(#glow2)"/>
  <!-- Single large gear — atmosphere only -->
  <circle cx="300" cy="250" r="200" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.08"/>
  <circle cx="300" cy="250" r="170" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.06"/>
  <circle cx="300" cy="250" r="130" fill="none" stroke="#f97316" stroke-width="0.8" opacity="0.05"/>
  <!-- Subtle cross marks -->
  <line x1="300" y1="80" x2="300" y2="140" stroke="#f97316" stroke-width="1" opacity="0.12"/>
  <line x1="300" y1="360" x2="300" y2="420" stroke="#f97316" stroke-width="1" opacity="0.12"/>
  <line x1="180" y1="250" x2="240" y2="250" stroke="#3b82f6" stroke-width="1" opacity="0.1"/>
  <line x1="360" y1="250" x2="420" y2="250" stroke="#3b82f6" stroke-width="1" opacity="0.1"/>
  <!-- Small accent circle -->
  <circle cx="520" cy="100" r="40" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.06"/>
  <circle cx="80" cy="380" r="30" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.05"/>
</svg>