<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%">
      <stop offset="0%" style="stop-color:rgba(249,115,22,0.15)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%">
      <stop offset="0%" style="stop-color:rgba(59,130,246,0.15)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#heroGrad)"/>
  <rect width="600" height="400" fill="url(#glow1)"/>
  <rect width="600" height="400" fill="url(#glow2)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="40" x2="600" y2="40" stroke="#f97316" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="600" y2="80" stroke="#f97316" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="600" y2="120" stroke="#f97316" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="600" y2="160" stroke="#f97316" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="#f97316" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="600" y2="240" stroke="#f97316" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="600" y2="280" stroke="#f97316" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="600" y2="320" stroke="#f97316" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="600" y2="360" stroke="#f97316" stroke-width="0.5"/>
    <line x1="120" y1="0" x2="120" y2="400" stroke="#f97316" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="400" stroke="#f97316" stroke-width="0.5"/>
    <line x1="360" y1="0" x2="360" y2="400" stroke="#f97316" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="400" stroke="#f97316" stroke-width="0.5"/>
