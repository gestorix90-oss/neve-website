  <!-- Abstract brain/gear shape -->
  <g transform="translate(300,200)" opacity="0.15">
    <path d="M-80,-20 Q-60,-60 -20,-50 Q20,-65 50,-30 Q70,-5 80,20 Q50,50 20,45 Q-10,60 -40,40 Q-70,35 -80,20 Z" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <path d="M-40,-20 Q-20,-40 10,-35 Q30,-45 50,-30" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
    <circle cx="-10" cy="-10" r="8" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Main text -->
  <text x="150" y="185" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="48" font-weight="900" fill="#fff" letter-spacing="2">
