    <path d="M0,-90 L14,-80 L20,-60 L28,-65 L33,-48 L44,-42 L46,-28 L55,-22 L61,-10 L67,2 L67,18 L73,25 L79,38 L73,50 L67,56 L55,62 L44,60 L33,68 L20,62 L14,72 L7,70 L0,76 L-7,70 L-14,72 L-20,62 L-33,68 L-44,60 L-55,62 L-67,56 L-73,50 L-67,38 L-73,25 L-67,18 L-67,2 L-61,-10 L-55,-22 L-46,-28 L-44,-42 L-33,-48 L-28,-65 L-20,-60 L-14,-80 Z" fill="none" stroke="#f97316" stroke-width="2"/>
    <circle r="35" fill="none" stroke="#f97316" stroke-width="1.5"/>
  </g>
  
  <!-- Small gear -->
  <g transform="translate(480,120) rotate(30)" opacity="0.25">
    <path d="M0,-50 L8,-44 L12,-32 L16,-35 L19,-24 L27,-20 L28,-14 L34,-11 L37,-3 L40,4 L40,11 L43,15 L47,21 L43,27 L40,30 L34,33 L37,38 L28,36 L22,43 L14,40 L10,47 L5,45 L0,48 L-5,45 L-10,47 L-14,40 L-22,43 L-28,36 L-37,38 L-34,33 L-40,30 L-43,27 L-47,21 L-43,15 L-40,11 L-40,4 L-37,-3 L-34,-11 L-28,-14 L-27,-20 L-19,-24 L-16,-35 L-12,-32 L-8,-44 Z" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
