<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1220"/>
      <stop offset="100%" style="stop-color:#111d35"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="70%">
      <stop offset="0%" style="stop-color:rgba(16,185,129,0.1)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="360" fill="url(#bg)"/>
  <rect width="800" height="360" fill="url(#glow)"/>
  <!-- Strong diagonal line suggesting growth -->
  <line x1="80" y1="280" x2="720" y2="80" stroke="#10b981" stroke-width="2.5" opacity="0.4"/>
  <line x1="80" y1="300" x2="720" y2="100" stroke="#10b981" stroke-width="1" opacity="0.2"/>
  <circle cx="680" cy="90" r="6" fill="#10b981" opacity="0.6"/>
  <circle cx="680" cy="90" r="14" fill="none" stroke="#10b981" stroke-width="1" opacity="0.3"/>
  <!-- Subtle horizontal bands -->
  <line x1="100" y1="200" x2="400" y2="200" stroke="#3b82f6" stroke-width="0.5" opacity="0.15"/>
  <line x1="100" y1="220" x2="350" y2="220" stroke="#3b82f6" stroke-width="0.5" opacity="0.1"/>
</svg>