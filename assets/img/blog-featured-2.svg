<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="blogGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#blogGrad2)"/>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="250" r="100" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.2"/>
  <circle cx="650" cy="150" r="70" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Chart bars (investment visualization) -->
  <g opacity="0.2">
    <rect x="200" y="200" width="30" height="120" rx="3" fill="url(#accentG)"/>
    <rect x="245" y="180" width="30" height="140" rx="3" fill="url(#accentG)"/>
    <rect x="290" y="140" width="30" height="180" rx="3" fill="url(#accentG)"/>
    <rect x="335" y="120" width="30" height="200" rx="3" fill="url(#accentG)"/>
    <rect x="380" y="100" width="30" height="220" rx="3" fill="url(#accentG)"/>
    <rect x="425" y="80" width="30" height="240" rx="3" fill="url(#accentG)"/>
  </g>
  
  <!-- Dollar sign -->
  <text x="560" y="220" font-family="Arial" font-size="140" font-weight="900" fill="#fbbf24" opacity="0.08">$</text>
  
  <!-- Category -->
  <rect x="60" y="40" width="120" height="32" rx="16" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="120" y="61" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="600" fill="#3b82f6">INVESTIMENTI</text>
  
  <!-- Title -->
  <text x="60" y="135" font-family="Inter, 'Segoe UI', Arial" font-size="34" font-weight="800" fill="#fff">
    Come Iniziare a
  </text>
  <text x="60" y="175" font-family="Inter, 'Segoe UI', Arial" font-size="34" font-weight="800" fill="#3b82f6">
    Investire
  </text>
  
  <!-- Subtitle -->
  <text x="60" y="220" font-family="Inter, 'Segoe UI', Arial" font-size="15" fill="#94a3b8">
    ETF, PAC, azioni: la guida completa per chi non sa
  </text>
  <text x="60" y="245" font-family="Inter, 'Segoe UI', Arial" font-size="15" fill="#94a3b8">
    ancora da dove partire
  </text>
  
  <!-- Author -->
  <g transform="translate(60, 315)">
    <circle cx="20" cy="12" r="12" fill="#334155" stroke="#3b82f6" stroke-width="2"/>
    <text x="38" y="16" font-family="Inter, Arial" font-size="13" fill="#cbd5e1">Antonio — TreasuryWorks</text>
  </g>
  
  <!-- Date -->
  <text x="60" y="365" font-family="Inter, Arial" font-size="12" fill="#475569">18 Maggio 2026 • 7 min di lettura</text>
</svg>