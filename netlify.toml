# Configurazione Netlify per il sito statico di SoldiChiari.
# Publish directory = radice del repository (nessun build step: HTML/CSS/JS puri).
[build]
  publish = "."
  command = ""

# Gli header di sicurezza stanno nel file _headers (formato Netlify).
[context.production.environment]
  NETLIFY_FORCE_HTTPS = "true"

# 301 redirects for deleted stub pages (Google Search Console fix)
[[redirects]]
  from = "/blog.html"
  to = "/blog/blog.html"
  status = 301
  force = true

[[redirects]]
  from = "/blog/"
  to = "/blog/blog.html"
  status = 301
  force = true

[[redirects]]
  from = "/blog/index.html"
  to = "/blog/blog.html"
  status = 301
  force = true

[[redirects]]
  from = "/calcolo-stipendio-netto.html"
  to = "/tools/calcolo-stipendio-netto.html"
  status = 301
  force = true

[[redirects]]
  from = "/blog/inflazione-agosto-2026-3-3.html"
  to = "/blog/inflazione-definitiva-agosto-2026-2026-09.html"
  status = 301
  force = true

[[redirects]]
  from = "/blog/inflazione-settembre-2026-4-2-percento-il-sole-24-ore-1-ottobre-2026.html"
  to = "/blog/istat-inflazione-acquisita-2026-sale-al-3-1-percento-2026-09-30.html"
  status = 301
  force = true

[[redirects]]
  from = "/blog/inflazione-settembre-2026-4-2-percento-istan-30-settembre-2026.html"
  to = "/blog/istat-inflazione-acquisita-2026-sale-al-3-1-percento-2026-09-30.html"
  status = 301
